name: publish

# 打 tag（v*）触发发布；也可在 Actions 页面手动触发（workflow_dispatch，发布 package.json 当前版本）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm --provenance 需要 OIDC
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: 语法检查
        run: node --check cli.js && node --check main.js && node --check postinstall.js

      - name: 校验 tag 与包版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 安装依赖（供 postinstall 冒烟与 pack 校验）
        run: npm install --no-audit --no-fund

      - name: 检查包内容
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
